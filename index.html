<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10161a"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Pissarra"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>Pissarra Tàctica</title><style>body{margin:0;background:#10161a;color:#fff;font-family:system-ui;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}header,.bar{padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}header{justify-content:space-between}select,button,input{padding:9px;border-radius:9px;border:1px solid #46535a;background:#172127;color:#fff}button{cursor:pointer}.main{display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px}.pitch{background:#287a43;border-radius:14px;overflow:hidden;touch-action:none}.pitch svg{width:100%;display:block}.p{cursor:grab}.p circle{stroke:#fff;stroke-width:2}.home circle{fill:#2677d2}.away circle{fill:#d64b4b}.p text{fill:#fff;text-anchor:middle;dominant-baseline:middle;font-weight:800}.ball{fill:#fff;stroke:#111;stroke-width:2}.panel{background:#172127;border-radius:14px;padding:12px}.timeline{display:flex;gap:6px;overflow:auto}.frame{padding:7px 11px;border:1px solid #46535a;border-radius:9px}.active{border-color:#ffd447}.primary{background:#ffd447;color:#111;font-weight:800}#installBtn{display:none;background:#2677d2;font-weight:800}@media(max-width:800px){.main{grid-template-columns:1fr}.panel{order:-1}header span{font-size:12px}.bar{gap:6px}select,button{font-size:13px;padding:8px}}</style></head><body><header><b>Pissarra Tàctica V1</b><span>22 jugadors · pilota · fotogrames · animació</span></header><div class="bar"><button id="installBtn">⬇ Instal·lar app</button><select id="hf"><option value="442d">Blau 4-4-2 rombe</option><option value="4231">Blau 4-2-3-1</option><option value="442">Blau 4-4-2</option></select><button onclick="formation('H',hf.value)">Aplicar blau</button><select id="af"><option value="4231">Vermell 4-2-3-1</option><option value="442">Vermell 4-4-2</option></select><button onclick="formation('A',af.value)">Aplicar vermell</button><button class="primary" onclick="dup()">+ Duplicar fotograma</button><button onclick="play()">▶ Reproduir</button><button onclick="save()">Desar</button></div><div class="main"><div><div class="pitch"><svg id="svg" viewBox="0 0 1050 680"><g fill="none" stroke="rgba(255,255,255,.75)" stroke-width="4"><rect x="20" y="20" width="1010" height="640"/><line x1="525" y1="20" x2="525" y2="660"/><circle cx="525" cy="340" r="92"/><rect x="20" y="170" width="165" height="340"/><rect x="20" y="255" width="60" height="170"/><rect x="865" y="170" width="165" height="340"/><rect x="970" y="255" width="60" height="170"/></g><g id="layer"></g></svg></div><div id="tl" class="timeline bar"></div></div><div class="panel"><b>Projecte</b><p><input id="name" value="Automatisme 01" style="width:100%"></p><p>Arrossega qualsevol jugador o la pilota. Quan tinguis la posició inicial, prem <b>Duplicar fotograma</b>, mou els jugadors a la següent posició i repeteix.</p><div id="sel">Cap jugador seleccionat.</div></div></div><script>const S=document.getElementById('svg'),L=document.getElementById('layer');const forms={H:{'442d':[[80,340],[220,240],[220,440],[330,100],[330,580],[365,340],[475,235],[475,445],[590,340],[710,270],[710,410]],'4231':[[80,340],[220,240],[220,440],[330,100],[330,580],[390,285],[390,395],[530,160],[550,340],[530,520],[710,340]],'442':[[80,340],[220,240],[220,440],[330,100],[330,580],[480,120],[470,275],[470,405],[480,560],[690,280],[690,400]]},A:{'4231':[[970,340],[830,240],[830,440],[730,100],[730,580],[670,285],[670,395],[590,160],[590,340],[590,520],[500,340]],'442':[[970,340],[830,240],[830,440],[730,100],[730,580],[620,120],[620,275],[620,405],[620,560],[500,280],[500,400]]}};let frames=[],cur=0,drag=null,selected=null;function initial(){let a=[];forms.H['442d'].forEach((p,i)=>a.push({id:'H'+i,t:'H',n:i+1,x:p[0],y:p[1]}));forms.A['4231'].forEach((p,i)=>a.push({id:'A'+i,t:'A',n:i+1,x:p[0],y:p[1]}));a.push({id:'B',t:'B',x:250,y:400});return a}frames=[initial()];function cp(x){return JSON.parse(JSON.stringify(x))}function draw(){L.innerHTML='';frames[cur].forEach(e=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('transform',`translate(${e.x} ${e.y})`);g.classList.add('p',e.t==='H'?'home':e.t==='A'?'away':'');g.dataset.id=e.id;g.innerHTML=e.t==='B'?'<circle class="ball" r="10"/>':`<circle r="22"/><text>${e.n}</text>`;g.onpointerdown=ev=>{selected=e.id;drag={e,dx:e.x-point(ev).x,dy:e.y-point(ev).y};g.setPointerCapture?.(ev.pointerId);document.getElementById('sel').textContent=e.t==='B'?'Pilota seleccionada':`Jugador ${e.n} seleccionat`};L.appendChild(g)});timeline()}function point(ev){let p=S.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(S.getScreenCTM().inverse())}S.onpointermove=ev=>{if(!drag)return;let p=point(ev);drag.e.x=Math.max(25,Math.min(1025,p.x+drag.dx));drag.e.y=Math.max(25,Math.min(655,p.y+drag.dy));draw()};window.onpointerup=()=>drag=null;function formation(team,key){let pos=forms[team][key],arr=frames[cur].filter(e=>e.t===team);arr.forEach((e,i)=>{e.x=pos[i][0];e.y=pos[i][1]});draw()}function dup(){frames.splice(cur+1,0,cp(frames[cur]));cur++;draw()}function timeline(){let t=document.getElementById('tl');t.innerHTML='';frames.forEach((f,i)=>{let b=document.createElement('button');b.className='frame '+(i===cur?'active':'');b.textContent='Fotograma '+(i+1);b.onclick=()=>{cur=i;draw()};t.appendChild(b)})}async function play(){if(frames.length<2)return;for(let i=0;i<frames.length-1;i++){cur=i;draw();let a=frames[i],b=frames[i+1],start=performance.now();await new Promise(res=>{function tick(now){let k=Math.min(1,(now-start)/1000);a.forEach(x=>{let y=b.find(z=>z.id===x.id),g=L.querySelector(`[data-id="${x.id}"]`);if(y&&g)g.setAttribute('transform',`translate(${x.x+(y.x-x.x)*k} ${x.y+(y.y-x.y)*k})`)});k<1?requestAnimationFrame(tick):res()}requestAnimationFrame(tick)})}cur=frames.length-1;draw()}function save(){localStorage.setItem('pissarra:'+name.value,JSON.stringify({name:name.value,frames}));alert('Desat en aquest dispositiu')}draw();let deferredPrompt=null;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'});window.addEventListener('appinstalled',()=>{installBtn.style.display='none'});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error))}</script></body></html>
